<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14391F"><title>Material de venta · FINANCO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--forest:#14391F;--deep:#0F2B17;--olive:#4F6330;--fill:#6F8444;--sage:#A9B98D;--soft:#E4EBD6;--cream:#F8F4EE;--sand:#E8D8C0;--ink:#1F2A1C;--muted:#56604E;--line:#DDD6C3;--red:#8A2A2A;--redbg:#F2D5D5}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito Sans',sans-serif;color:var(--ink);background:var(--cream);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1,h2,h3,.num{font-family:'Montserrat',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.hdr{background:var(--forest);color:#fff;padding:max(12px,env(safe-area-inset-top)) 12px 12px;position:sticky;top:0;z-index:20}
.hdr .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hdr img{height:26px;width:auto}
.hdr h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:22px;font-weight:700}
.demo{background:var(--sand);color:#4A3A1A;font-size:13px;font-weight:700;padding:8px 16px;text-align:center}
main{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin:22px 0 10px;font-family:'Nunito Sans',sans-serif;font-weight:800}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);padding:14px}
.kpi b{display:block;font-family:'Montserrat',sans-serif;font-size:28px;color:var(--forest);line-height:1.05}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);padding:16px}
.list{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--line);padding:14px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer}
.av{flex:none;width:42px;height:42px;background:var(--soft);color:var(--forest);font-family:'Montserrat',sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center}
.card .m{flex:1;min-width:0}
.card b.n{font-size:16px;display:block}
.s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:#DCE7C8;color:#243A14}.p-mid{background:#F1E6CC;color:#5A4210}.p-low{background:#E7E2E2;color:#5B4A4A}.p-dark{background:var(--forest);color:#fff}.p-red{background:var(--redbg);color:#7A1F1F}.p-blue{background:#D9E4EE;color:#23415F}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{flex:none;min-height:40px;padding:0 14px;border:2px solid var(--forest);background:transparent;color:var(--forest);font-weight:800;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--forest);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:2px solid var(--forest);background:var(--forest);color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.btn.o{background:#fff;color:var(--forest)}.btn.d{border-color:var(--red);color:var(--red);background:#fff}.btn.sm{min-height:40px;font-size:13px;padding:0 12px}
.btn[disabled],.btn.off{opacity:.5;pointer-events:none}
.f label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #C9C2AE;background:#fff;border-radius:0}
.f.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;margin:auto auto 0;background:var(--cream);overflow:auto}
dialog::backdrop{background:rgba(15,43,23,.6)}
dialog .h{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 18px;background:var(--forest);color:#fff;position:sticky;top:0;z-index:2}
dialog .h h2{flex:1;font-size:17px}
dialog .b{padding:16px 18px 24px;display:grid;gap:14px}
.ib{min-width:44px;min-height:44px;background:transparent;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.note{font-size:12px;color:var(--muted)}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:14px}
.tag{position:absolute;left:8px;bottom:8px;background:rgba(20,57,31,.92);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;max-width:calc(100% - 16px)}
.q{border-top:1px solid var(--line)}.q summary{list-style:none;cursor:pointer;min-height:52px;padding:14px 28px 14px 0;font-weight:800;color:var(--forest);position:relative}.q summary::-webkit-details-marker{display:none}.q summary:after{content:"+";position:absolute;right:4px;top:12px;font-size:22px;color:var(--olive)}.q[open] summary:after{content:"–"}.q p{padding:0 0 14px;font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 20px;font-weight:700;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(min-width:900px){dialog{margin:auto;max-height:88vh}.kpis{grid-template-columns:repeat(4,1fr)}.list.two{grid-template-columns:1fr 1fr}}

.sy{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}.sy-ok{background:#DCE7C8;color:#243A14}.sy-low{background:rgba(255,255,255,.18);color:#fff}.sy-err{background:var(--redbg);color:#7A1F1F}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;background:#fff;border:1px solid var(--line);padding:0;cursor:pointer;display:block;width:100%}
.ph img{width:100%;height:150px;object-fit:cover;display:block}
.ph.fit img{object-fit:contain;background:#fff}
.ph .c{padding:8px 10px;text-align:left;font-size:13px;font-weight:800;color:var(--forest)}
.doc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:14px}
.doc .ic{flex:none;width:44px;height:44px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--forest)}
.doc .m{flex:1;min-width:0}.doc b{display:block}
.msg{background:#fff;border:1px solid var(--line);padding:14px}
.msg h3{font-size:15px;color:var(--forest);margin-bottom:6px}
.msg p.t{font-size:14px;white-space:pre-wrap;background:var(--cream);padding:10px;border-left:3px solid var(--sage)}
.kv{display:grid;gap:0}.kv div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.kv b{text-align:right;color:var(--forest)}
.no{background:var(--redbg);padding:14px;color:#5A1818;font-size:14px}.no li{margin:4px 0}
.lb img{width:100%;max-height:60vh;object-fit:contain;background:#fff}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.ph img{height:170px}}
</style><style id="dswcss">.dsw{max-width:1100px;margin:0 auto;padding:18px 20px 28px;font:600 12px "Nunito Sans",Arial,sans-serif;color:#56604E;text-align:center;line-height:1.6}.dsw a{color:#14391F;font-weight:800;text-decoration:none;border-bottom:1px solid #A9B98D}.dsw span{white-space:nowrap}@media print{.dsw{display:none}}</style></head><body>

if(!window.Sync){window.Sync={enabled:function(){return false},setStatus:function(){},diff:function(){},snap:function(){return{}},bool:function(v){return v===true||v==='true'},nul:function(v){return v===''||v===undefined?null:v},num:function(v,d){var n=parseFloat(v);return isNaN(n)?d:n},config:function(){return Promise.resolve({})}}}

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var dlg=$('dlg');function closeD(){dlg.close()}
function shell(t,b){dlg.innerHTML='<div class="h"><h2>'+esc(t)+'</h2><button class="ib" id="dx" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="b">'+b+'</div>';$('dx').onclick=closeD;if(!dlg.open)dlg.showModal()}
