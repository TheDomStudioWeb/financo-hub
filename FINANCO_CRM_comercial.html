<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14391F"><title>CRM comercial · FINANCO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forest:#14391F;--deep:#0F2B17;--olive:#4F6330;--fill:#6F8444;--sage:#A9B98D;--soft:#E4EBD6;--cream:#F8F4EE;--sand:#E8D8C0;--ink:#1F2A1C;--muted:#56604E;--line:#DDD6C3;--red:#8A2A2A;--redbg:#F2D5D5}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito Sans',sans-serif;color:var(--ink);background:var(--cream);line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:84px}
h1,h2,h3,p{margin:0}
h1,h2,h3,.num{font-family:'Montserrat',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.hdr{background:var(--forest);color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20}
.hdr .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hdr img{height:28px;width:auto}
.hdr h1{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hdr .sy,.hdr .ib{flex:none}
.sy{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}.sy-ok{background:#DCE7C8;color:#243A14}.sy-low{background:rgba(255,255,255,.18);color:#fff}.sy-err{background:var(--redbg);color:#7A1F1F}
.ib{min-width:44px;min-height:44px;background:transparent;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.demo{background:var(--sand);color:#4A3A1A;font-size:13px;font-weight:700;padding:8px 16px;text-align:center}
.demo button{background:none;border:0;text-decoration:underline;font-weight:800;color:#4A3A1A;cursor:pointer;font-size:13px;min-height:32px}
main{max-width:1100px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button[aria-current=page]{color:var(--forest)}
nav.tabs button[aria-current=page]:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--forest)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);padding:14px;text-align:left;cursor:pointer;width:100%}
.kpi b{display:block;font-family:'Montserrat',sans-serif;font-size:30px;color:var(--forest);line-height:1}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.kpi.warn b{color:var(--red)}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin:22px 0 10px;font-family:'Nunito Sans',sans-serif;font-weight:800}
.list{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--line);padding:14px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer}
.av{flex:none;width:42px;height:42px;background:var(--soft);color:var(--forest);font-family:'Montserrat',sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center}
.card .m{flex:1;min-width:0}
.card b.n{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.e-nuevo{background:#DCE7C8;color:#243A14}.e-contactado{background:#E8E3D1;color:#4A4328}.e-calificado{background:#CFE0D3;color:#1B4A2A}.e-turno{background:#F1E6CC;color:#5A4210}.e-visito{background:#D9E4EE;color:#23415F}.e-asociado{background:var(--forest);color:#fff}.e-perdido{background:#E7E2E2;color:#5B4A4A}.late{background:var(--redbg);color:#7A1F1F}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input,.search select,.f input,.f select,.f textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #C9C2AE;background:#fff;border-radius:0}
.search select{width:auto;max-width:46%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;min-height:40px;padding:0 14px;border:2px solid var(--forest);background:transparent;color:var(--forest);font-weight:800;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--forest);color:#fff}
.fab{position:fixed;right:16px;bottom:78px;z-index:21;width:56px;height:56px;background:var(--forest);color:#fff;border:0;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:0;cursor:pointer}.fab span{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:2px solid var(--forest);background:var(--forest);color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.btn.o{background:#fff;color:var(--forest)}.btn.d{border-color:var(--red);color:var(--red);background:#fff}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions .btn{padding:0 6px;font-size:13px}
dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;margin:auto auto 0;background:var(--cream);overflow:auto}
dialog::backdrop{background:rgba(15,43,23,.55)}
dialog .h{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 18px;background:var(--forest);color:#fff;position:sticky;top:0;z-index:2}
dialog .h h2{flex:1;font-size:17px}
dialog .b{padding:16px 18px 24px;display:grid;gap:14px}
.f label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}
.f.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{display:grid;gap:8px}
.hist div{border-left:3px solid var(--sage);padding:2px 0 2px 10px;font-size:14px}
.hist small{color:var(--muted);display:block;font-size:12px}
/* embudo */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.col{flex:none;width:78vw;max-width:300px;background:#EFEADC;padding:10px;scroll-snap-align:start}
.col h3{font-size:13px;display:flex;justify-content:space-between;margin-bottom:10px;color:var(--forest)}
.col .card{padding:10px;margin-bottom:8px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.bar i{display:block;height:14px;background:var(--fill)}
.bar div{background:var(--soft);height:14px}
.bar b{text-align:right;font-family:'Montserrat',sans-serif}
.panel{background:#fff;border:1px solid var(--line);padding:16px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.task{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px}
.task .m{flex:1;min-width:0}
.task input[type=checkbox]{width:26px;height:26px;accent-color:var(--forest);flex:none}
.hr{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--forest);min-width:54px}
.note{font-size:12px;color:var(--muted)}
@media(min-width:900px){
 body{padding-bottom:0}
 nav.tabs{position:static;max-width:1100px;margin:0 auto;border:0;background:transparent;grid-template-columns:repeat(5,160px);gap:0;border-bottom:1px solid var(--line)}
 nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;min-height:52px}
 .badge{position:static;margin-left:4px}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .list{grid-template-columns:1fr 1fr}
 dialog{margin:auto;max-height:88vh}
 .col{width:260px}
 .fab{bottom:24px;width:auto;border-radius:0;padding:0 20px;height:52px}.fab span{display:inline}
 .tabwrap{background:#fff}
}
</style><style id="dswcss">.dsw{max-width:1100px;margin:0 auto;padding:18px 20px 28px;font:600 12px "Nunito Sans",Arial,sans-serif;color:#56604E;text-align:center;line-height:1.6}.dsw a{color:#14391F;font-weight:800;text-decoration:none;border-bottom:1px solid #A9B98D}.dsw span{white-space:nowrap}@media print{.dsw{display:none}}</style></head><body>

<script>
/* CONFIGURACIÓN (ajustar acá) */
var CFG={
 slaHoras:24,                       /* horas máximas para contactar un lead nuevo */
 asesores:["Daniel","Asesor 1","Asesor 2"],
 origenes:["Instagram","Web","DOMINO","WhatsApp","Referido","Otro"],
 intereses:["Dúplex 80 m²","Dúplex Carmener","Sin definir"],
 estados:[["nuevo","Nuevo"],["contactado","Contactado"],["calificado","Calificado"],["turno","Turno agendado"],["visito","Visitó"],["asociado","Asociado"],["perdido","Perdido"]],
 plantilla:"Hola {nombre}, te escribo de FINANCO Cooperativa de Vivienda. Recibimos tu consulta sobre {interes}. ¿Te cuento cómo funciona el plan?",
 syncUrl:""                         /* futuro: enlace para conectar con Google Sheets */
};
var KEY='financo_crm_v1',S={leads:[],tareas:[],demo:false},tab='hoy',fl={q:'',estado:'',origen:'',asesor:''};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncPush()}
var SN={leads:{},tareas:{}};
function normL(l){l.notas=Array.isArray(l.notas)?l.notas:[];l.contacto=Sync.nul(l.contacto);l.resultado=l.resultado||'';l.asesor=l.asesor||'';return l}
function normT(t){t.hecha=Sync.bool(t.hecha);return t}
function syncPush(){Sync.diff('leads',S.leads,SN.leads);Sync.diff('tareas',S.tareas,SN.tareas)}
function pending(){return JSON.stringify(Sync.snap(S.leads))!==JSON.stringify(SN.leads)||JSON.stringify(Sync.snap(S.tareas))!==JSON.stringify(SN.tareas)}
function pull(){return Promise.all([Sync.list('leads'),Sync.list('tareas')]).then(function(r){S.leads=r[0].map(normL);S.tareas=r[1].map(normT);S.demo=false;SN.leads=Sync.snap(S.leads);SN.tareas=Sync.snap(S.tareas);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}})}
function refresh(){if(!Sync.enabled()||pending()||dlg.open)return;pull().then(render).catch(function(){})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.leads){S=x;return true}}catch(e){}return false}
function pad(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
var DS=['dom','lun','mar','mié','jue','vie','sáb'];
function fdate(s){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return DS[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function fdt(iso){var d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
