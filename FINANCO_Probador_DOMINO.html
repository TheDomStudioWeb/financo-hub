<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14391F"><meta name="robots" content="noindex, nofollow"><title>Probador de DOMINO · FINANCO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forest:#14391F;--deep:#0F2B17;--olive:#4F6330;--fill:#6F8444;--sage:#A9B98D;--soft:#E4EBD6;--cream:#F8F4EE;--sand:#E8D8C0;--ink:#1F2A1C;--muted:#56604E;--line:#DDD6C3;--card:#fff;--bot:#fff;--me:#DCE7C8;--chatbg:#EFE9DD;--red:#8A2A2A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cream:#101712;--ink:#E8EDE3;--muted:#A5B2A4;--line:#2C3A2F;--card:#1A241C;--bot:#1F2B21;--me:#2F4A2A;--chatbg:#0C130E;--soft:#24331F;--forest:#A9CC8A;--olive:#A9CC8A;--sand:#3A2F1B}}
:root[data-theme=dark]{--cream:#101712;--ink:#E8EDE3;--muted:#A5B2A4;--line:#2C3A2F;--card:#1A241C;--bot:#1F2B21;--me:#2F4A2A;--chatbg:#0C130E;--soft:#24331F;--forest:#A9CC8A;--olive:#A9CC8A;--sand:#3A2F1B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.45;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;
 padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
h1,h2,h3,p{margin:0}
h1,h2,h3,.num{font-family:'Montserrat',sans-serif}
button,input{font-family:inherit;font-size:16px;color:inherit}
.hdr{background:#14391F;color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 10px;flex:none}
.hdr .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hdr img{height:26px;width:auto}
.hdr h1{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;min-height:36px;padding:0 12px;font-weight:800;font-size:13px;cursor:pointer}
.demo{background:var(--sand);color:#4A3A1A;font-size:12.5px;font-weight:700;padding:7px 14px;text-align:center;flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .demo{color:#E8D8C0}}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto}
#chat{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;background:var(--chatbg);display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.b{max-width:84%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:15px}
.b.bot{align-self:flex-start;background:var(--bot);border-top-left-radius:3px}
.b.me{align-self:flex-end;background:var(--me);border-top-right-radius:3px}
.b small{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);text-align:right}
.typing{align-self:flex-start;background:var(--bot);border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:t 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}#chat{scroll-behavior:auto}}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:96%}
.opts button{min-height:44px;padding:0 14px;border:2px solid var(--forest);background:var(--card);color:var(--forest);font-weight:800;font-size:14px;cursor:pointer;border-radius:22px}
.opts button:active{background:var(--forest);color:#fff}
.hints{padding:8px 12px 0;background:var(--cream);display:flex;gap:8px;overflow-x:auto;flex:none}
.hints button{flex:none;min-height:34px;padding:0 12px;border:1px dashed var(--olive);background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;border-radius:17px}
.hints b{flex:none;align-self:center;font-size:12px;color:var(--muted)}
form{display:flex;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:var(--cream);flex:none}
form input{flex:1;min-width:0;min-height:48px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:24px}
form button{min-height:48px;min-width:48px;border:0;background:#14391F;color:#fff;font-weight:800;border-radius:24px;padding:0 18px;cursor:pointer}
form button[disabled],form input[disabled]{opacity:.5}
.ficha{align-self:stretch;background:var(--card);border:1px solid var(--line);padding:14px;display:grid;gap:10px;margin:6px 0}
.ficha h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);font-family:'Nunito Sans',sans-serif;font-weight:800}
.ficha .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.ficha .nom{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px}
.p-alta{background:#DCE7C8;color:#243A14}.p-media{background:#F1E6CC;color:#5A4210}.p-baja{background:#E7E2E2;color:#5B4A4A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .p-alta{background:#2F4A2A;color:#DCE7C8}:root:not([data-theme=light]) .p-media{background:#4A3E1E;color:#F1E6CC}:root:not([data-theme=light]) .p-baja{background:#3A3535;color:#E7E2E2}}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans div{background:var(--soft);padding:8px 10px;min-width:0}
.ans small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ans b{font-size:14px;overflow-wrap:anywhere}
.sig{display:flex;flex-wrap:wrap;gap:6px}
.sig span{font-size:12.5px;font-weight:700;background:var(--sand);color:#4A3A1A;padding:3px 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sig span{color:#E8D8C0}}
.why{font-size:13px;color:var(--muted)}
.again{min-height:48px;border:2px solid var(--forest);background:var(--forest);color:#fff;font-weight:800;cursor:pointer;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .again{color:#0F2B17}}
.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 12px 2px;flex:none}
.foot a{color:var(--olive)}
@media (max-width:420px){.ans{grid-template-columns:1fr}}
</style></head><body>

<script>
/* ── Motor de DOMINO (el mismo que usa el asistente real) ── */
const DOMINO = (function(){ const module = {exports:{}};

/* DOMINO · motor de conversación como filtro de embudo.
   Todo lo propio de cada cliente está en un archivo de configuración (config.*.json).
   Para otro cliente (por ejemplo X5) se cambia la configuración, no este archivo. */


const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const has = (text, claves) => claves.some((c) => norm(text).includes(norm(c)));

function crear(cfg, opciones = {}) {
  const S = new Map();
  const ahora = opciones.ahora || (() => new Date());

  function nueva(sid, meta) {
    const s = { sid, paso: 'nombre', i: 0, nombre: '', tel: (meta && meta.tel) || '', canal: (meta && meta.canal) || cfg.canal,
      resp: {}, puntos: 0, senales: [], chat: [], intentos: 0, pidioAsesor: false, forzaAlta: false, cerrada: false };
    S.set(sid, s);
    return s;
  }
  const decir = (s, out, t) => { out.push(t); s.chat.push(['bot', t]); };

  function preguntaTexto(q) {
    return q.texto + '\n' + q.opciones.map((o, k) => (k + 1) + '. ' + o.etiqueta).join('\n');
  }

  function elegir(q, texto) {
    const t = norm(texto);
    if (/^\d+$/.test(t)) { const o = q.opciones[parseInt(t, 10) - 1]; if (o) return o; }
    const exacta = q.opciones.find((o) => norm(o.etiqueta) === t);
    if (exacta) return exacta;
    // las claves más largas primero para que "no se" gane a "no"
    const cand = [];
    q.opciones.forEach((o) => o.claves.forEach((c) => { if (t.includes(norm(c))) cand.push([norm(c).length, o]); }));
    cand.sort((a, b) => b[0] - a[0]);
    return cand.length ? cand[0][1] : null;
  }

  function clasificar(s) {
    const c = cfg.calificacion;
    const p = s.puntos + (s.pidioAsesor ? c.pidioAsesor : 0);
    if (s.pidioAsesor || s.forzaAlta || p >= c.alta) return 'alta';  // una opción con alta:true (anticipo mayor al mínimo, auto usado) clasifica Alta sin importar los puntos
    return p >= c.media ? 'media' : 'baja';
  }

  function cerrar(s, out) {
    s.cerrada = true;
    const p = clasificar(s);
    const m = cfg.mensajes['cierre' + p[0].toUpperCase() + p.slice(1)].replace('{nombre}', s.nombre || '');
    decir(s, out, m);
    return { replies: out, done: true, row: fila(s, p) };
  }

  function fila(s, p) {
    const t = ahora();
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + pad(t.getUTCHours()) + pad(t.getUTCMinutes());
    return { id: 'c-' + (s.tel.replace(/\D/g, '') || s.sid) + '-' + stamp, n: s.nombre, tel: s.tel, canal: s.canal,
      t: t.toISOString(), p, e: cfg.hub.estadoInicial, r: s.resp, sig: s.senales.slice(), chat: s.chat.slice() };
  }

  function desvios(s, text, out) {
    // 1) pide hablar con un asesor
    if (!s.pidioAsesor && has(text, cfg.pedirAsesor)) { s.pidioAsesor = true; s.senales.push('Pidió hablar con un asesor'); }
    // 2) temas que todavía no están confirmados: nunca se inventan
    for (const tema of cfg.temasNoConfirmados) {
      if (has(text, tema.claves)) {
        const sen = 'Preguntó por ' + tema.etiqueta;
        if (!s.senales.includes(sen)) s.senales.push(sen);
        decir(s, out, cfg.mensajes.derivaDato);
        return true;
      }
    }
    // 3) datos confirmados
    for (const h of cfg.hechosConfirmados) {
      if (has(text, h.claves)) { decir(s, out, h.texto); return true; }
    }
    return false;
  }

  function handle(sid, texto, meta) {
    const out = [];
    let s = S.get(sid);

      if (s.intentos >= 2) { // no se pudo entender: se registra "No lo sé" y se sigue
        s.resp[q.id] = 'Sin respuesta'; s.intentos = 0; s.i++;
        if (s.i >= cfg.preguntas.length) return cerrar(s, out);
        decir(s, out, preguntaTexto(cfg.preguntas[s.i]));
        return { replies: out, done: false };
      }

      decir(s, out, preguntaTexto(q));
      return { replies: out, done: false };

    s.resp[q.id] = op.etiqueta; s.puntos += op.puntos; s.intentos = 0; s.i++;

}

/* Envío de la consulta al Hub (hoja de Google). Usa variables de entorno:
   DOMINO_HUB_URL (la URL /exec) y DOMINO_TOKEN (la clave de DOMINO). Sin ellas, no envía. */
async function enviarAlHub(row, cfg, env = process.env) {
  const url = env.DOMINO_HUB_URL, token = env.DOMINO_TOKEN;
  if (!url || !token) return { ok: false, omitido: true, motivo: 'Falta DOMINO_HUB_URL o DOMINO_TOKEN' };
  const body = JSON.stringify({ action: 'upsert', tab: cfg.hub.tab, token, rows: [row] });
  let ultimo;
  for (let k = 0; k < 2; k++) {
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      const j = await r.json();
      if (j.ok) return j;
      ultimo = j;
    } catch (e) { ultimo = { ok: false, error: String(e.message || e) }; }
  }
  return ultimo;
}
